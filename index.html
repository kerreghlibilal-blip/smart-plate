<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGGhyY1ri6oa6IEvwhUkSv361lH5q3SgA",
  authDomain: "smart-plate-dz-a76d3.firebaseapp.com",
  projectId: "smart-plate-dz-a76d3",
  storageBucket: "smart-plate-dz-a76d3.firebasestorage.app",
  messagingSenderId: "304661540147",
  appId: "1:304661540147:web:4c98086b7ade79e3026246"
};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.register = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
      .then(() => {
        document.getElementById("message").innerText = "✅ Compte créé avec succès";
      })
      .catch((error) => {
        document.getElementById("message").innerText = "❌ " + error.message;
      });
  };
</script>
