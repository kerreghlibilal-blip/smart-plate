<!DOCTYPE html>
<html>
<head>
  <title>Smart Plate - Inscription</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:50px;">

<h2>Créer un compte Smart Plate</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Mot de passe"><br><br>

<button onclick="register()">Créer mon compte</button>

<p id="message"></p>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAGGhyY1ri6oa6IEvwhUkSv361lH5q3SgA",
  authDomain: "smart-plate-dz-a76d3.firebaseapp.com",
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => {
      document.getElementById("message").innerText = "Compte créé avec succès";
    })
    .catch(error => {
      document.getElementById("message").innerText = error.message;
    });
}
</script>

</body>
</html>
