<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "MET_ICI_TA_VRAIE_API_KEY",
    authDomain: "smart-plate-dz-a76d3.firebaseapp.com",
    projectId: "smart-plate-dz-a76d3",
    storageBucket: "smart-plate-dz-a76d3.appspot.com",
    messagingSenderId: "304661540147",
    appId: "MET_ICI_TON_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.register = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
      .then(() => {
        document.getElementById("message").innerText = "✅ Compte créé avec succès";
      })
      .catch((error) => {
        document.getElementById("message").innerText = "❌ " + error.message;
      });
  };
</script>
