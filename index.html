<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Smart Plate - Inscription</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
    }

    .box {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: black;
      color: white;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Créer un compte Smart Plate</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">

    <button id="registerBtn">Créer mon compte</button>

    <p id="message"></p>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // ⚠️ REMPLACE PAR TES VRAIES INFOS FIREBASE
    const firebaseConfig = {
      apiKey: "ICI_TA_API_KEY",
      authDomain: "ICI_TON_AUTH_DOMAIN",
      projectId: "ICI_TON_PROJECT_ID",
      storageBucket: "ICI_TON_STORAGE",
      messagingSenderId: "ICI_TON_SENDER_ID",
      appId: "ICI_TON_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const btn = document.getElementById("registerBtn");
    const message = document.getElementById("message");

    btn.addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.innerText = "";

      if (!email || !password) {
        message.innerText = "Remplir tous les champs";
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        message.innerText = "✅ Compte créé avec succès";
      } catch (error) {
        message.innerText = "❌ " + error.message;
      }
    });
  </script>

</body>
</html>
